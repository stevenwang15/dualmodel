name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Deliberately no `pip install -r requirements.txt`: the routing and config
      # modules must import with the standard library alone. If a torch import
      # creeps back into that path, this job is what catches it.
      - name: Routing and config tests
        run: python -m unittest discover -s tests -v
